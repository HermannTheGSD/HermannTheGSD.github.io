
name: Publish HermannSoft Website

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "7,22,37,52 * * * *"

concurrency:
  group: hermannsoft-pages
  cancel-in-progress: true

jobs:
  build:
    name: Prepare website
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Download private Silex project
        uses: actions/checkout@v6
        with:
          repository: HermannTheGSD/hermannsoft-silex-source
          ref: main
          token: ${{ secrets.PRIVATE_SITE_READ_TOKEN }}
          path: site
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Build Silex website
        working-directory: site
        shell: bash
        run: |
          set -e
          test -f build.sh
          sh build.sh
          test -f _site/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload website
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/_site

  deploy:
    name: Deploy website
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
