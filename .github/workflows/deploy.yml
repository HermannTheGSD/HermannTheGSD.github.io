
name: Publish HermannSoft Website

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "7,22,37,52 * * * *"

concurrency:
  group: hermannsoft-pages
  cancel-in-progress: true

jobs:
  build:
    name: Prepare website
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Download latest Silex files
        uses: actions/checkout@v6
        with:
          repository: HermannTheGSD/hermannsoft-silex-source
          ref: main
          token: ${{ secrets.PRIVATE_SITE_READ_TOKEN }}
          path: site
          persist-credentials: false

      - name: Prepare website files
        shell: bash
        run: |
          set -euo pipefail

          test -f site/public/index.html

          mkdir -p publish
          cp -a site/public/. publish/

          test -f publish/index.html

          echo "Website source:"
          git -C site rev-parse HEAD

          echo "Files to publish:"
          find publish -maxdepth 2 -type f

          echo "Website preparation successful"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload website
        uses: actions/upload-pages-artifact@v5
        with:
          path: publish

  deploy:
    name: Deploy website
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
